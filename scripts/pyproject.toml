[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtros-tools"
version = "0.1.0"
description = "仓库内的开发工具集合：编译/烧录、守卫、串口服务器、ramdump 采集与解析"
readme = "AGENTS.md"
requires-python = ">=3.11"
# 运行时依赖：只有两个第三方包（其余全部标准库）。
dependencies = [
    "pyserial>=3.5",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.3",
    "mypy==1.18.2",
    "pytest>=8",
]

# ---------------------------------------------------------------------------
# 格式化 + lint（唯一配置来源；行长只在这里定义一次）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["."]

[tool.ruff.lint]
# 规则集取舍原则：**只留能长期守住、且不逼着写废话的规则**。
# 2026-10 二次修订（M6 清零时）移出三类规则，理由见 select 之后的注释。
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "RUF", # ruff 自有规则
    "D100", "D101",  # 模块 / 类必须有 docstring
]
ignore = [
    "E501",  # 行长交给 formatter
    "D400",  # 首行以句号结尾（中文 docstring 用「。」会被误报）
    "D415",
    # 中文注释/docstring 里必然出现全角标点（，。：、），RUF001-003 会把它们
    # 报成「歧义的 Unicode 字符」——对 CJK 项目是纯噪音，关掉。
    "RUF001",
    "RUF002",
    "RUF003",
]
# 移出的规则与理由（不是"改不动"，是"不该这么要求"）：
# - T20（print）：scripts/ 是命令行工具集，stdout 就是结果通道；CLI 入口、TUI、测试脚本
#   用 print 是正确写法。库内仍自觉用 runtime.logging（human=结果 / diag=诊断），靠 review 守。
# - PTH（use-pathlib）：新代码一律 pathlib；残留 os.path 分散在 20+ 个历史模块共 132 处，
#   且 ruff 不提供自动修复，强改收益低于 review 成本。后续按包逐步迁移，迁完可再开启。
# - D102/D103（函数/方法 docstring）：125 处集中在 mixin 与内部实现，靠类型标注 + 命名已足够；
#   强制每函数写一句会催生"Get the value."式废话。模块与类级仍强制。
# 另注：UP031 已按文件批量换成 f-string；剩 17 处是跨行格式串，用行内 `# noqa: UP031` 显式豁免
# （改成 f-string 会被拉成超长单行，反而更难读）。

[tool.ruff.lint.per-file-ignores]
# 测试与一次性检查脚本不要求 docstring
"tests/*" = ["D101"]
"*/tests/*" = ["D101"]
"ramdump/test/*" = ["D101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# 类型检查（渐进式：先只覆盖两个核心包，通过后再逐包扩大）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["firmware", "guard", "cli.py"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

# ---------------------------------------------------------------------------
# 测试
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers -p no:cacheprovider"
testpaths = ["tests", "ramdump/test", "serial_hub/tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "hw: 需要真实硬件（板子/串口/调试器）的测试，默认不跑",
    "slow: 超过 1 秒的测试",
]
