# ---------------------------------------------------------------------------
# 守卫任务表 —— 唯一定义「哪些命令允许被请求执行」的地方。
#
# 守卫只按这里拼好的 argv 执行（subprocess，**不经 shell**）；请求里的参数只能
# 填进 {bin} / {target}，其余占位符一律来自 [paths]，调用方无法注入路径。
# 加一条任务 = 往本文件加一段 [[tasks]]，不用改 guard.py。
#
# 每条任务：
#   id      请求里写的名字（`--request <id>`），全表唯一
#   title   人看的一行说明
#   timeout 单次总时长上限（秒）
#   allow   允许请求携带的参数名（note 永远允许；只有 bin/target 有意义）
#   run     argv 列表的列表：按顺序执行，任一条失败即整条任务失败
#   cwd     工作目录（默认仓库根）
#   builtin 少数需要内嵌 Python 源码的任务，指到 guard.py 里的实现
#
# 占位符：{repo} {python} + [paths] 里的每个键（{venv_python} {pyocd_python}
#         {pyocd_pack} {build_entry} ...）+ 请求参数 {bin} {target}
# ---------------------------------------------------------------------------

[guard]
protocol          = 1
mailbox           = "out/guard"
poll_seconds      = 2.0
heartbeat_seconds = 2.0
stall_seconds     = 180.0
default_expires   = 900
default_wait      = 300.0

[paths]
# 路径可以是绝对路径，也可以是相对仓库根（守卫会补全）。
python         = "{python}"
venv_python    = "E:/software/EnvEdition/rt-thread-env/env-windows/.venv/Scripts/python.exe"
env_root       = "E:/software/EnvEdition/rt-thread-env/env-windows"
arm_gcc_bin    = "E:/software/EnvEdition/rt-thread-env/env-windows/tools/gnu_gcc/arm_gcc/mingw/bin"
# pkg/ 里的 cffi、hidapi 是 CPython 3.13 的二进制 wheel，必须用同 ABI 的解释器。
pyocd_python   = "E:/software/InstallerEdition/DevTools/Python/Python313/python.exe"
pyocd_pkg      = "tools/pyocd/pkg"
# 新版 pyocd 不内置芯片定义，必须显式给仓内精简 pack（离线、可复现）。
pyocd_pack     = "tools/pyocd/packs/Keil.STM32F4xx_DFP.2.14.0-small.pack"
build_entry    = "scripts/firmware/build.py"
default_bin    = "out/bin/base/rtthread.bin"
default_target = "STM32F407VE"

# ---------------------------------------------------------------- 烧录
[[tasks]]
id      = "flash"
title   = "烧录固件（pyocd flash）"
timeout = 180
allow   = ["bin", "target"]
run = [[
  "{pyocd_python}", "-m", "pyocd", "flash",
  "--pack", "{pyocd_pack}",
  "--target", "{target}",
  "--erase=auto", "--frequency=1000000",
  "{bin}",
]]

[[tasks]]
id      = "build_flash"
title   = "编译 + 烧录"
timeout = 1100
allow   = ["bin", "target"]
run = [
  ["{venv_python}", "{build_entry}", "build"],
  [
    "{pyocd_python}", "-m", "pyocd", "flash",
    "--pack", "{pyocd_pack}",
    "--target", "{target}",
    "--erase=auto", "--frequency=1000000",
    "{bin}",
  ],
]

# ---------------------------------------------------------------- 编译
[[tasks]]
id      = "build"
title   = "编译（项目模式，默认 projects/base）"
timeout = 900
run = [["{venv_python}", "{build_entry}", "build"]]

[[tasks]]
id      = "build_board"
title   = "编译（板级 BSP 模式，等价 --board）"
timeout = 900
run = [["{venv_python}", "{build_entry}", "--board", "build"]]

# ---------------------------------------------------------------- 探针操作
[[tasks]]
id      = "list"
title   = "pyocd list -v：看调试器认不认得到"
timeout = 60
run = [["{pyocd_python}", "-m", "pyocd", "list", "-v", "--pack", "{pyocd_pack}"]]

[[tasks]]
id      = "reset"
title   = "pyocd reset：复位目标"
timeout = 60
allow   = ["target"]
run = [["{pyocd_python}", "-m", "pyocd", "reset", "--pack", "{pyocd_pack}", "--target", "{target}"]]

[[tasks]]
id      = "erase"
title   = "pyocd erase --chip：整片擦除"
timeout = 180
allow   = ["target"]
run = [["{pyocd_python}", "-m", "pyocd", "erase", "--chip", "--pack", "{pyocd_pack}", "--target", "{target}"]]

# ---------------------------------------------------------------- 守卫自带诊断（实现内嵌在 guard.py）
[[tasks]]
id      = "probe"
title   = "环境自检：TEMP/临时目录可写、pyocd 版本、pkg 在不在"
timeout = 90
builtin = "probe"

[[tasks]]
id      = "usb"
title   = "用 pyusb/libusb 枚举 USB 设备（看 libusb 能看见谁）"
timeout = 60
builtin = "usb"

[[tasks]]
id      = "selftest"
title   = "守卫自检：只跑一条无害的 python -c，验证信箱协议"
timeout = 30
builtin = "selftest"
