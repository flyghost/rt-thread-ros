# 项目清单（单一事实来源）：一块板可以衍生多个项目，差异全部写在这里
[project]
name = "base"
board = "stm32f407-atk-explorer"   # 对应 bsp/stm32/<board>/
variant = "release"                # release | debug（供脚本使用）
target = "rt-thread"               # 产物名前缀

[config]
# 本项目的内核配置来源。P2 阶段先用项目目录下的 rtconfig.h（由 menuconfig 生成）；
# 后续可改为：defconfig = "<repo>/bsp/stm32/<board>/defconfig" + overlay = "config.fragment"
rtconfig_h = "rtconfig.h"

[flash]
pyocd_target = "STM32F407VE"
pack = "scripts/tools/pyocd/packs/Keil.STM32F4xx_DFP.2.14.0-small.pack"
