# 质量门 + 固件编译回归
#
# 与本地同源：质量门的步骤顺序只在 Python 里定义，YAML 只调用它。
#   * 质量门 = `python -X utf8 scripts/toolbelt/tools/run.py ci`
#     （= quality all 七门：ruff check / ruff format --check / mypy / pytest /
#       docs-check / neutrality / check-bat）
#   * 固件编译 = `python -X utf8 scripts/toolbelt/tools/run.py build build`（不需要烧录器）
#   * 工具版本只在 scripts/toolbelt/tools/pyquality/install.py 里写一遍，
#     CI 用 `--print-pins` 取用，避免两处维护漂移。
#
# 注意：tools/ 是 git submodule，checkout 必须带 submodules: recursive，
# 否则 scripts/toolbelt 是空目录，第一步就会挂。

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-quality:
    name: 质量门（ruff / format / mypy / pytest / docs / neutrality / bat）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 子模块指针必须与工作树一致
        run: |
          set -euo pipefail
          pointer="$(git rev-parse HEAD:scripts/toolbelt)"
          checked_out="$(git -C scripts/toolbelt rev-parse HEAD)"
          echo "parent pointer: $pointer"
          echo "submodule HEAD: $checked_out"
          test "$pointer" = "$checked_out"

      - name: 安装工具（版本见 tools/pyquality/install.py）
        run: |
          python -m pip install --upgrade pip
          python -m pip install $(python -X utf8 scripts/toolbelt/tools/pyquality/install.py --print-pins)

      - name: 一条命令跑完质量门
        run: python -X utf8 scripts/toolbelt/tools/run.py ci

  firmware-build:
    name: 固件编译（projects/base）
    runs-on: ubuntu-latest
    # 未在本机验证过 Linux 构建（本地是 Windows + RT-Thread Env 工具链），
    # 先用软失败：红的会提示，但不阻塞质量门通过。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          python -m pip install "scons==4.8.1"

      - name: 编译
        env:
          RTT_EXEC_PATH: /usr/bin
          VENV: ${{ env.pythonLocation }}
          SCONS_JOBS: "4"
        run: python -X utf8 scripts/toolbelt/tools/run.py build build

      - name: 产物摘要
        run: |
          ls -l out/bin/*/ out/build/*/ 2>/dev/null | head -20
