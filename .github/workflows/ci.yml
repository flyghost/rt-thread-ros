# Python 质量门 + 固件编译回归
#
# 与本地完全同源：
#   * 质量检查 = `python scripts/quality.py all`（ruff / ruff format / mypy / pytest，
#     配置在 scripts/pyproject.toml，版本与 tools/pyquality/install.py 一致）
#   * .bat 约束 = `python scripts/check_bat.py`（纯 ASCII + CRLF）
#   * 固件编译 = `python scripts/run_rtros.py build build`（不需要烧录器）
#
# 说明：本地工具装在 tools/pyquality/pkg（gitignore），CI 里改成装到 site-packages，
# 版本号保持一致；quality.py 通过 `python -m <tool>` 调用，两种安装位置都能找到。

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-quality:
    name: Python 质量（ruff / format / mypy / pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装工具（版本与 tools/pyquality/install.py 一致）
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.14.3 mypy==1.18.2 pytest==8.4.2 pyserial pyelftools

      - name: doctor（工具是否齐）
        run: python scripts/quality.py doctor

      - name: 质量门
        run: python scripts/quality.py all

      - name: .bat 必须纯 ASCII + CRLF
        run: python -X utf8 scripts/check_bat.py

  firmware-build:
    name: 固件编译（projects/base）
    runs-on: ubuntu-latest
    # 未在本机验证过 Linux 构建（本地是 Windows + RT-Thread Env 工具链），
    # 先用软失败：红的会提示，但不阻塞质量门通过。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          python -m pip install "scons==4.8.1"

      - name: 编译
        env:
          RTT_EXEC_PATH: /usr/bin
          VENV: ${{ env.pythonLocation }}
          SCONS_JOBS: "4"
        run: python scripts/run_rtros.py build build

      - name: 产物摘要
        run: |
          ls -l out/bin/*/ out/build/*/ 2>/dev/null | head -20
