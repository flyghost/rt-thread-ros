# 工程清单：工具仓库（scripts/）只认契约，本仓事实写在这里。
# 工具侧行为：文件缺失 → 报错退出；必填键缺失/路径不存在 → 报错；环境变量优先于本文件。
# 所有相对路径都相对「本文件所在目录」（工程根）。完整说明见 scripts/README.md「工程清单」。

[project]
name = "base"                      # 默认项目（projects/<name>）；PROJECT 环境变量可覆盖

[workspace]
bsp_dir = "bsp/stm32/stm32f407-atk-explorer"
projects_dir = "projects"

[build]
toolchain_root = "E:/software/EnvEdition/rt-thread-env/env-windows"  # RTT_EXEC_PATH / VENV 由它推导
scons_jobs = 20

[flash]
target = "STM32F407VE"
pack = "scripts/tools/pyocd/packs/Keil.STM32F4xx_DFP.2.14.0-small.pack"
python = "E:/software/InstallerEdition/DevTools/Python/Python313/python.exe"  # 装了 pyocd 的解释器
opts = "--erase=auto --frequency=1000000"

[serial]
port = "COM46"                     # 板上 CH340 → USART1
baud = 115200
